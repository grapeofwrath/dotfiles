env = XCURSOR_SIZE,32

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 0, 3, wind, slide
    animation = windowsIn, 0, 3, winIn, slide
    animation = windowsOut, 1, 2, winOut, slide
    animation = windowsMove, 1, 2, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 50, liner, loop
    animation = fade, 1, 2, default
    animation = workspaces, 1, 3, wind
}

general {
    border_size = 2
    gaps_in = 6
    gaps_out = 12
    layout = dwindle
}

decoration {
    rounding = 9
    rounding_power = 2.0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

input {
    kb_options = caps:escape
    numlock_by_default = true
    natural_scroll = false
    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

cursor {
    no_hardware_cursors = true
}

# windowrule = float, ^(blender)$
